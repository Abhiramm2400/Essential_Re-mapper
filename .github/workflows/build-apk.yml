name: Build and Release APK V1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Essential_Re-mapper-V1-by-Abhiramm.apk || cp app/build/outputs/apk/debug/*.apk release/
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Essential_Re-mapper-V1-APK
          path: release/*.apk
          retention-days: 90
