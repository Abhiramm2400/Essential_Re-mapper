
name: Build and Release APK V1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew || true
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Essential_Re-mapper-V1-by-Abhiramm.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Essential_Re-mapper-V1-APK
          path: release/Essential_Re-mapper-V1-by-Abhiramm.apk
          retention-days: 90
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/Essential_Re-mapper-V1-by-Abhiramm.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
